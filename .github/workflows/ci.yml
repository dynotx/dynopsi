name: CI

on:
  pull_request:

env:
  UV_VERSION: '0.8.15'
  JUST_VERSION: '1.40.0'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
      cancel-in-progress: true
    env:
      MYPY_CACHE_DIR: /tmp/mypy-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          uv_version: ${{ env.UV_VERSION }}
          just_version: ${{ env.JUST_VERSION }}
      - name: Cache mypy
        uses: actions/cache@v6
        with:
          path: ${{ env.MYPY_CACHE_DIR }}
          key: mypy-${{ hashFiles('uv.lock') }}-v1 # NOTE: Bump to manually cache bust
          restore-keys: |
            mypy-${{ hashFiles('uv.lock') }}
      - name: CI lint
        run: just ci-lint
  test-unit:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-test-unit-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          uv_version: ${{ env.UV_VERSION }}
          just_version: ${{ env.JUST_VERSION }}
      - name: Run unit tests
        run: just test-unit
